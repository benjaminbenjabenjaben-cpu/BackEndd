{% extends 'core/base.html' %}
{% block titulo %}Iniciar sesión | Music Pro{% endblock %}
{% block contenido %}
<section class="tarjeta acceso">
  <h1>Acceso administrativo</h1>
  <p class="text-secondary">Ingresa con tu cuenta para administrar el transporte.</p>
  {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label" for="username">Nombre de usuario</label>
      <input class="form-control" type="text" name="username" id="username" value="{{ username|default:'' }}" maxlength="150" autocomplete="username" required autofocus>
    </div>
    <div class="mb-4">
      <label class="form-label" for="password">Contraseña</label>
      <input class="form-control" type="password" name="password" id="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary w-100" type="submit">Ingresar</button>
  </form>
  <p class="mt-3 mb-0"><a href="{% url 'core:portal' %}">Volver al seguimiento de pedidos</a></p>
</section>
{% endblock %}
